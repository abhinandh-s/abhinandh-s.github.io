# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      TYPST_FEATURES: "bundle,html"
      CREATE_RELEASE: "false"
      COMMIT_BACK: "false"
  
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!
      
      - uses: typst-community/setup-typst@v4
      # Now Typst is installed!
      #- run: typst compile main.typ output.pdf # <-- 01 change output name: 

      - name: Get my Typst UI library
        uses: abhinandh-s/typst-ui-kit@master
     
      - name: Run typst bundle
        run: typst compile main.typ dist --format bundle
      
      - name: Inject Google Tag into HTML files
        run: |
          TAG_SNIPPET='<script async src="https://www.googletagmanager.com/gtag/js?id=G-NNZCZG2JYD"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-NNZCZG2JYD");</script>'

          find dist -type f -name "*.html" -exec sed -i "0,/<head>/s#<head>#<head>${TAG_SNIPPET}#" {} +

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Pretty print HTML with Deno
        run: |
          deno run -A npm:prettier --write "dist/**/*.html"


      - name: List output
        run: |
          ls
          ls dist/
          
      # Generate the timestamp for the tag
      - name: Get current time
        id: date
        run: echo "timestamp=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

        
      - name: Commit generated files
        if: env.COMMIT_BACK == 'true' 
        uses: stefanzweifel/git-auto-commit-action@v5
        # Adding continue-on-error temporarily so the workflow doesn't fail 
        # while we are just trying to read the tree output!
        continue-on-error: true 
        with:
          commit_message: "chore: compile typst to bundle"
          add_options: '-f'
          file_pattern: 'dist/' 

      # Use the timestamp as the tag
      - name: Create Release
        if: env.CREATE_RELEASE == 'true' 
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.timestamp }}
          name: "Release: ${{ steps.date.outputs.timestamp }}"
          body: "Automated build for commit ${{ github.sha }}"
          files: dist/output.pdf # <-- 02 change output name

          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
    
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5